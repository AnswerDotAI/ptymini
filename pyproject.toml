[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ptymini"
dynamic = ["version"]
description = "Asyncio pty sessions: spawn, write, multi-client attach with replay, and a named registry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ['fastcore>=2.1.18']

[project.optional-dependencies]
dev = ["maturin>=1.0,<2.0", "pytest", "nbdev>=3", "fastship"]

[project.entry-points.pyskills]
ptymini = "ptymini.skill"

[project.urls]
Repository = "https://github.com/AnswerDotAI/ptymini"
Documentation = "https://AnswerDotAI.github.io/ptymini/"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "ptymini._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = ".git/fastws-cargo-key" }]

[tool.fastship]
branch = "main"

[tool.nbdev]
